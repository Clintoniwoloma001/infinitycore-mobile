name: infinitycore
description: "InfinityCore Mobile — Infinity Microfinance Bank enterprise companion app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Continues from the active 1.1.1+10. 1.1.2+11 was created as a draft by a run
# that was interrupted mid-upload, and Shorebird has no command to promote or
# delete a draft, so the build number moves to +12 to get a clean, fully
# uploaded release. Carries: cross-platform RBAC single-source fix, 2-minute
# background tracking with the offline queue and auto-sync, and SARA tool
# authorization.
# Sections 2, 4, 5 executive UI + Branch Performance 42702 fix + executive
# role constraint + I-Meet audio signed-URL fix.
# +13 continues from the active 1.1.2+12.
# +16 is the Executive BI base release. It ADDS NATIVE PLUGINS, so it cannot be
# a Shorebird patch and must ship through the App Store / Play Store. Once users
# install 1.1.6+16, later Dart-only work (analytics, comboboxes, branch
# attribution) can return to silent OTA patches (patch 17+).
version: 1.1.6+16

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.3
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7
  flutter_dotenv: ^6.0.1
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  # Already present transitively (and therefore already compiled into the
  # shipped APK) via share_plus. Declared directly because messaging now uses
  # it for `tel:` phone-call actions and opening signed attachment URLs.
  # Promoting an existing transitive dependency adds no new native plugin, so
  # this stays deliverable as a Shorebird patch.
  url_launcher: ^6.3.1
  shorebird_code_push: ^2.0.7
  mobile_scanner: ^7.4.2
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  record: ^7.1.1
  just_audio: ^0.10.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5

  # --- 1.1.6+16: OpenStreetMap via PURE DART ---------------------------
  # `flutter_map` renders OSM tiles with NO native plugin and NO API key, so it
  # introduces nothing that a Shorebird patch cannot deliver. The previous
  # google_maps_flutter dependency was removed for exactly this reason.
  flutter_map: ^6.1.0
  # Shared LatLng type used by flutter_map and by our own geo maths.
  latlong2: ^0.9.0
  # `geocoding` supplies the reverse-geocoded address shown on the live card.
  #
  # NOTE: this is the ONLY genuinely new NATIVE plugin left in this release, and
  # it is already redundant — the server resolves `resolved_place` and
  # `location_label` for every ping, so the address is already on the row.
  # Dropping it would remove the last native dependency and let this entire
  # release ship as a silent Shorebird PATCH instead of a store submission.
  geocoding: ^4.0.0

  # Direct dependency now, because supabase_flutter reaches for it directly and
  # the widget tests import its mock. Relying on a transitive version is
  # unpinned, and an unrelated bump could change what the tests exercise.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - shorebird.yaml

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Official InfinityCore/SARA launcher icon (rendered from the brand mark).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/infinitycore_mark.png"
  adaptive_icon_background: "#009944"
  adaptive_icon_foreground: "assets/images/infinitycore_mark_fg.png"
  web:
    generate: true
    image_path: "assets/images/infinitycore_mark.png"
    background_color: "#009944"
    theme_color: "#009944"

# Native launch splash using the dark InfinityCore canvas + mark.
flutter_native_splash:
  color: "#0D1117"
  image: "assets/images/infinitycore_mark_light.png"
  android_12:
    color: "#0D1117"
    image: "assets/images/infinitycore_mark_light.png"
  ios: true
  web: true
  android: true
